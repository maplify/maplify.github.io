<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudFire - Maplify</title>
    <style>
        /* 全局样式 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #111;
            color: #fff;
        }

        /* 头部样式 */
        header {
            background-color: #333;
            padding: 10px;
            text-align: center;
        }

        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }

        nav ul li {
            display: inline;
            margin-right: 20px;
        }

        nav ul li a {
            color: #fff;
            text-decoration: none;
        }

        nav ul li a:hover {
            text-decoration: underline;
        }

        /* 首页英雄部分样式 */
     .hero {
            position: relative;
            height: 400px;
            overflow: hidden;
        }

     .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(70%);
        }

     .hero-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

     .hero-content h2 {
            font-size: 36px;
            margin-bottom: 20px;
        }

     .hero-content p {
            font-size: 18px;
            margin-bottom: 30px;
        }

     .cta-button {
            display: inline-block;
            background-color: #007BFF;
            color: #fff;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
        }

     .cta-button:hover {
            background-color: #0056b3;
        }

        /* 特色部分样式 */
     .features {
            padding: 50px;
            text-align: center;
        }

     .features h2 {
            margin-bottom: 30px;
        }

     .feature {
            display: inline-block;
            width: 300px;
            margin: 20px;
            background-color: #444;
            padding: 20px;
            border-radius: 10px;
        }

     .feature img {
            width: 80px;
            height: 80px;
        }

     .feature h3 {
            margin-top: 20px;
            margin-bottom: 10px;
        }

        /* 规则部分样式 */
     .rules {
            padding: 50px;
            text-align: left;
        }

     .rules h2 {
            margin-bottom: 20px;
        }

     .rules ul {
            margin-left: 20px;
        }

        /* 加入部分样式 */
     .join {
            padding: 50px;
            text-align: center;
        }

     .join h2 {
            margin-bottom: 20px;
        }

     .join.server-address,
     .join.server-port {
            font-size: 20px;
            font-weight: bold;
        }

        /* 社区部分样式 */
     .community {
            padding: 50px;
            text-align: center;
        }

     .community h2 {
            margin-bottom: 20px;
        }

     .community img {
            width: 40px;
            height: 40px;
            margin: 0 10px;
        }

        /* 底部样式 */
        footer {
            background-color: #333;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>

<body>
    <header>
        <h1>Maplify</h1>
        <nav>
            <ul>
                <li><a href="./">首页</a></li>
            </ul>
        </nav>
    </header>
    <section id="home" class="hero">
        <img src="https://s2.loli.net/2025/01/29/JSH5xAUzaZtgE4v.png" alt="FOEN">
        <div class="hero-content">
            <h2>欢迎</h2>
            <p>Maplify是由CloudFire管理的Minecraft Server Plugin</p>
            <a href="mailto:i@catp.cc" class="cta-button">建立联系</a>
        </div>
    </section>
    <footer>
        <p>&copy; Copyright CloudFire 2026</p>
    </footer>
</body>

</html>
